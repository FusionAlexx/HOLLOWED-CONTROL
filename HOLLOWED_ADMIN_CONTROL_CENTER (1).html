<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOLLOWED — Admin Control Center</title><style>:root{--text:#e7e9e6;--muted:#929992;--line:#292e2b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#080909,#050606);color:var(--text);font:16px/1.6 Arial,Helvetica,sans-serif}.wrap{width:min(92%,900px);margin:auto}header{padding:70px 0 45px;border-bottom:1px solid var(--line)}section{padding:45px 0}.eyebrow,.label{text-transform:uppercase;letter-spacing:.25em;color:var(--muted);font-size:.72rem}h1{font-size:clamp(2.5rem,8vw,5rem);line-height:1;margin:18px 0}.note{color:var(--muted)}.status{padding:15px;border:1px solid var(--line);background:#0b0d0d;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.role,a,button{padding:15px;border:1px solid #737a74;background:#111414;color:var(--text);cursor:pointer;font:inherit;text-decoration:none}.role{text-align:left;width:100%}.role.taken{background:#162019;border-color:#59635d}.role-status{display:block;margin-top:5px;color:var(--muted);font-size:.72rem;letter-spacing:.14em}.role.taken .role-status{color:var(--text)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="eyebrow">HOLLOWED • Restricted Area</div><h1>Admin Control Center</h1><p class="note">Use the magic link to enter. Anyone who has the link can manage recruitment availability here.</p><div id="status" class="status">Checking authentication…</div><div class="actions"><a href="HOLLOWED_RECRUITMENT_ADMIN_CONTROLS_DISCRETE.html#recruits">View recruitment page</a><button id="signout" hidden>Sign out</button></div></div></header><main class="wrap"><section id="controls" hidden><div class="label">Recruitment controls</div><h2>Role availability</h2><p class="note">Click a role to switch it between OPEN and TAKEN.</p><div id="roles" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const u='https://iliqgmybltqmudttsigm.supabase.co',k='sb_publishable_FzjFLO6z0V_wzUC0cZa1cQ_cbKMKwPb',s=window.supabase.createClient(u,k,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),status=document.getElementById('status'),controls=document.getElementById('controls'),roles=document.getElementById('roles'),signout=document.getElementById('signout');const names={'game-programmer':'Game Programmer','godot-programmer':'Godot Programmer','3d-artist':'3D Artist','creature-artist':'Creature Artist','level-designer':'Level Designer','sound-designer':'Sound Designer','qa-tester':'QA Tester','lore-worldbuilding':'Lore / Worldbuilding','other':'Other'};async function load(){const{data:{user}}=await s.auth.getUser();if(!user){status.textContent='Access denied. Open this page from your HOLLOWED magic link.';controls.hidden=true;signout.hidden=true;return}status.textContent='Authenticated. Recruitment controls unlocked.';controls.hidden=false;signout.hidden=false;const{data,error}=await s.from('recruitment_roles').select('id,status');if(error){status.textContent='Recruitment data could not be loaded: '+error.message;return}roles.innerHTML='';data.forEach(r=>{const b=document.createElement('button');b.className='role'+(r.status==='taken'?' taken':'');b.dataset.role=r.id;b.innerHTML='<span>'+(names[r.id]||r.id)+'</span><span class="role-status">'+(r.status==='taken'?'TAKEN ☣':'OPEN')+'</span>';b.onclick=async()=>{const{data:{user}}=await s.auth.getUser();if(!user)return alert('Open this page from your HOLLOWED magic link.');const n=b.classList.contains('taken')?'open':'taken';const{error}=await s.from('recruitment_roles').update({status:n,updated_at:new Date().toISOString()}).eq('id',b.dataset.role);if(error)return alert('The role could not be updated: '+error.message);b.classList.toggle('taken',n==='taken');b.querySelector('.role-status').textContent=n==='taken'?'TAKEN ☣':'OPEN'};roles.appendChild(b)})}signout.onclick=async()=>{await s.auth.signOut();location.href='HOLLOWED_RECRUITMENT_ADMIN_CONTROLS_DISCRETE.html'};s.auth.onAuthStateChange(()=>setTimeout(load,0));load()})();</script></body></html>
